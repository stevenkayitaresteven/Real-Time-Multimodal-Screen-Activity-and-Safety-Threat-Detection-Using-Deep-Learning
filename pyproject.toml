[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "screenguard"
version = "0.1.0"
description = "Real-time multimodal screen activity and safety threat detection using deep learning"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pillow>=10.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
vision = ["torchvision>=0.16"]
deploy = ["onnx>=1.15", "onnxruntime>=1.17"]
capture = ["mss>=9.0", "opencv-python>=4.8"]
timm = ["timm>=0.9"]
dev = ["pytest>=7"]
all = ["torchvision>=0.16", "onnx>=1.15", "onnxruntime>=1.17", "mss>=9.0", "opencv-python>=4.8", "pytest>=7"]

[project.scripts]
screenguard = "screenguard.cli:main"

[tool.setuptools.packages.find]
include = ["screenguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
